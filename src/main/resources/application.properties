# Medias de la bibliotheque stockes dans Bucketeer (Amazon S3).
# Bucketeer fournit automatiquement les quatre variables BUCKETEER_* sur Heroku.
bibliotheque.storage.s3.access-key-id=${BUCKETEER_AWS_ACCESS_KEY_ID:}
bibliotheque.storage.s3.secret-access-key=${BUCKETEER_AWS_SECRET_ACCESS_KEY:}
bibliotheque.storage.s3.region=${BUCKETEER_AWS_REGION:}
bibliotheque.storage.s3.bucket=${BUCKETEER_BUCKET_NAME:}
bibliotheque.storage.upload-url-duration-minutes=${BIBLIOTHEQUE_UPLOAD_URL_DURATION_MINUTES:30}
bibliotheque.storage.download-url-duration-minutes=${BIBLIOTHEQUE_DOWNLOAD_URL_DURATION_MINUTES:15}
bibliotheque.storage.max-file-size-bytes=${BIBLIOTHEQUE_MAX_FILE_SIZE_BYTES:536870912}
